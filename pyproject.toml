[project]
name = "astro-1"
version = "0.3.0"
description = "Pipeline automatique de traitement d'astrophotos : calibration, empilement, post-traitement. Pilote Siril et GraXpert via des profils YAML."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Damien Fischetti" },
]
keywords = ["astrophotography", "siril", "graxpert", "pipeline", "narrowband", "HaOIII"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "typer>=0.12",      # construction de la CLI
    "pydantic>=2.7",    # validation des profils YAML
    "pyyaml>=6.0",      # lecture des profils
    "rich>=13.7",       # affichage lisible dans le terminal
    "numpy>=1.26",      # recombinaison StarNet (max pixel par pixel)
    "astropy>=5.0",     # lecture/écriture FITS pour recombinaison StarNet
    "scipy>=1.12",      # filtre médian pour débruitage du fond (4 couches)
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",      # tests automatisés
]
mcp = [
    "mcp[cli]>=1.0,<2",  # serveur MCP pour itération IA (Claude Desktop, Cursor…)
]
starnet = [
    # StarNet2 doit être installé séparément (https://starnetastro.com)
    # Ce groupe n'installe que les deps Python pour la recombinaison.
]

[project.scripts]
astro = "astro_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astro_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
