# ============================================================================
# PROFIL SETUP — Canon DSLR (star trails & météores)
# ============================================================================
# Profil générique pour appareil photo Canon DSLR produisant des CR2.
# Siril lit les métadonnées du RAW automatiquement (dimensions, Bayer pattern).
# ============================================================================

name: "Canon DSLR"

sensor:
  color: true
  bayer_pattern: "auto"
  equalize_cfa: true

optics:
  focal_length_mm: 50
  aperture_mm: 35
  pixel_size_um: 5.97

folders:
  lights: "lights"
  darks: "darks"
  flats: "flats"
  biases: "biases"

calibration:
  use_biases: false
  use_premade_masters: false
  cosmetic_correction: false