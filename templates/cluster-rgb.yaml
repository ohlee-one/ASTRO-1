# ============================================================================
# TEMPLATE — Amas d'étoiles (ouvert ou globulaire)
# ============================================================================
# Les amas sont denses en étoiles et n'ont pas de nébuleuse. Le traitement
# est plus simple : moins de saturation, pas de rmgreen agressif, pas de
# background_clip (on veut garder un fond naturel).
#
# Copie ce fichier dans profiles/targets/ et renomme-le selon ta cible.
# ============================================================================

name: "Amas d'étoiles RGB (template)"

processing:
  mode: "rgb"

stacking:
  rejection: "winsorized"
  sigma_low: 3.0
  sigma_high: 3.0
  normalization: "addscale"

registration:
  min_stars: 10

post:
  background_extraction:
    enabled: true
    smoothing: 0.3
    correction: "subtraction"

  denoise:
    # Pas de débruitage sur un amas : les étoiles sont ponctuelles et le
    # débruitage flouterait leurs bords.
    enabled: false
    strength: 0.2
    batch_size: 8

  starnet:
    enabled: false
    upscale: false
    stretch_linear: false

  stretch:
    enabled: true
    method: "autostretch"
    linked: true
    shadows_clip: -2.8
    # target_bg légèrement plus sombre pour un fond noir naturel.
    target_bg: 0.2

  color:
    enabled: true
    # Les amas ont des étoiles colorées (bleues, jaunes, rouges) qu'on
    # veut préserver. Saturation modérée, pas de rmgreen agressif.
    rmgreen: true
    rmgreen_type: "average"
    saturation_boost: 0.5
    saturation_threshold: 0.5
    hue_range: 6
    target_hue_boost: 0.0
    blue_shift: 0.0
    # Pas de background_clip : on garde un fond naturel.
    background_clip: 0.0

  sharpening:
    # Les étoiles sont ponctuelles → peu de sharpening nécessaire.
    # Un léger unsharp peut aider à les rendre plus nettes.
    enabled: true
    method: "unsharp"
    sigma: 0.8
    amount: 0.3

  star_reduction:
    # ⚠️ Ne pas réduire les étoiles sur un amas : c'est le sujet principal !
    enabled: false
    amount: 0.5

  export:
    enabled: true
    format: "tiff"
    deflate: true